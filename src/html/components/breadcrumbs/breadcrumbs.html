<nav class="breadcrumbs" aria-label="Хлебные крошки">
    <div class="breadcrumbs__container">
        <ul>
            {{#each items}}
            <li>
                {{#if @last}}
                <span aria-current="page">{{this.title}}</span>
                {{else}}
                <a href="{{this.url}}">{{this.title}}</a>
                {{/if}}
            </li>
            {{/each}}
        </ul>
    </div>
</nav>
