<div class="js-dropdown dropdown" role="button" tabindex="0" aria-haspopup="true">
    <span class="js-dropdown__current">{{current}}</span>

    <div class="js-dropdown__option">
        {{#each options}}
        <div class="js-dropdown-link">{{this.label}}</div>
        {{/each}}
    </div>
</div>
