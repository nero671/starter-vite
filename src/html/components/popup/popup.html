<!-- Модальное окно. Открыть: <button data-type="popup">. Закрыть: .button-close, клик по фону или Escape -->

    <div class="popup-wrapper _overlay-bg">
        <div class="popup-content">
            <button class="popup-close button-close" type="button" aria-label="Закрыть">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M2 18L18 2" stroke="#0A0829" />
                    <path d="M18 18L2 2" stroke="#0A0829" />
                </svg>
            </button>

            <div class="popup-title">

            </div>

            <div class="popup-text">

            </div>

        </div>

    </div>
</div>
